[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsl-rag"
version = "0.1.0"
description = "RAG system for EU Transport & Logistics compliance"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "openai>=1.35.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "pgvector>=0.3.0",
    "sentence-transformers>=3.0.0",
    # Zadeklarowany JAWNIE, mimo że wchodzi tranzytywnie przez sentence-transformers:
    # [tool.uv.sources] na dole pliku działa tylko na zależności bezpośrednie,
    # więc bez tego wpisu przypięcie wariantu CPU jest po cichu ignorowane.
    "torch>=2.0.0,<2.13",
    # torchvision MUSI iść z tego samego indeksu co torch — rozszerzenia C++
    # są kompilowane pod konkretny build. Mieszanka (torch z indeksu CPU,
    # torchvision z PyPI) daje "operator torchvision::nms does not exist",
    # co objawia się dopiero przy imporcie transformers.
    "torchvision>=0.15.0",
    "rank-bm25>=0.2.2",
    "loguru>=0.7.2",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "tenacity>=8.3.0",
    "tiktoken>=0.7.0",
    "typer>=0.24.1",
    "streamlit>=1.56.0",
    "google-genai>=1.70.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
# Zależności WYŁĄCZNIE ingestu. Poza główną listą, bo obraz produkcyjny API
# ich nie uruchamia: ingest jest ręczny (13 PDF-ów, odpalany lokalnie przez
# właściciela repo), a `unstructured[pdf]` wciąga za sobą torchvision, opencv
# i spacy — czyli stos wizyjny, przez który obraz puchł do gigabajtów
# i wywracał się na niezgodności torchvision z torchem.
#   uv sync --extra ingest    # przed uruchomieniem `ingest-all`
ingest = [
    "pdfplumber>=0.11.0",
    "pymupdf>=1.24.0",
    "unstructured[pdf]>=0.14.0",
]
eval = [
    "ragas>=0.1.14",
    "datasets>=2.20.0",
    "pandas>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "ipykernel>=6.29.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tsl_rag"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "PTH"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
# Bez mypy_path mypy rozwiązywał tsl_rag do kopii zainstalowanej w .venv
# i zgłaszał "missing py.typed marker" dla WŁASNYCH modułów projektu —
# 25 z 40 błędów było artefaktem tej konfiguracji, nie kodu.
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "rank_bm25.*", "pdfplumber.*", "fitz.*",
    "unstructured.*", "sentence_transformers.*",
    "pgvector.*", "ragas.*", "yaml.*",
    "asyncpg.*", "tqdm.*", "google.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "unit: pure unit tests, no external deps",
    "integration: requires postgres",
    "e2e: full stack",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument", "fastapi.Depends", "fastapi.Query"]

# --- torch: wyłącznie wariant CPU ---
#
# Domyślne koło torcha z PyPI na Linuksie to build CUDA. W obrazie produkcyjnym
# dawało to 2725 MB pakietów `nvidia/*` plus 691 MB `triton` — sterowniki do karty,
# której w kontenerze nie ma. Ten system z założenia liczy embeddingi na CPU
# (CLAUDE.md §6.3: sentence-transformers, embeddingi lokalne na CPU), a `torch.cuda
# .is_available()` w zbudowanym obrazie zwracało False.
#
# Zmierzone: obraz 3.45 GB → patrz PLAN.md Faza 5.
# Na Windowsie domyślne koło i tak jest CPU, więc lokalne środowisko się nie zmienia.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
